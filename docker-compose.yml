
version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: gopulse-rabbitmq
    ports:
      - "5672:5672"   # AMQP protokolü -- connect the application to RabbitMQ
      - "15672:15672" # Management UI -- view queues in the browser
    environment:
      RABBITMQ_DEFAULT_USER: gopulse
      RABBITMQ_DEFAULT_PASS: gopulse_dev_password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5